<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f5f1ed"/>
      <stop offset="100%" stop-color="#ece5e0"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fdfcfb"/>
      <stop offset="100%" stop-color="#f3f0ed"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#a6b49d"/>
      <stop offset="100%" stop-color="#758a67"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <g opacity="0.9">
    <ellipse cx="1180" cy="180" rx="140" ry="45" fill="url(#leaf)" transform="rotate(18 1180 180)"/>
    <ellipse cx="1268" cy="210" rx="130" ry="38" fill="url(#leaf)" transform="rotate(28 1268 210)"/>
    <ellipse cx="1175" cy="255" rx="120" ry="32" fill="url(#leaf)" transform="rotate(38 1175 255)"/>
  </g>

  <g opacity="0.8">
    <ellipse cx="340" cy="640" rx="120" ry="34" fill="url(#leaf)" transform="rotate(-42 340 640)"/>
    <ellipse cx="300" cy="700" rx="120" ry="30" fill="url(#leaf)" transform="rotate(-30 300 700)"/>
    <ellipse cx="380" cy="710" rx="120" ry="28" fill="url(#leaf)" transform="rotate(-18 380 710)"/>
  </g>

  <g>
    <rect x="490" y="120" width="620" height="590" rx="12" fill="url(#paper)" filter="url(#softShadow)"/>
    <rect x="550" y="170" width="500" height="510" rx="10" fill="#f9f7f5" opacity="0.9"/>
  </g>

  <g opacity="0.55">
    <rect x="210" y="245" width="430" height="360" rx="14" fill="#fbf9f7" transform="rotate(-9 210 245)"/>
    <rect x="950" y="340" width="420" height="360" rx="14" fill="#fbf9f7" transform="rotate(8 950 340)"/>
  </g>
</svg>
